<text x="52" y="127" font-size="13.5" font-weight="700" fill="#f0efec">Conversation</text>
<text x="52" y="145" font-size="11" fill="#c3c2b7">every message</text>
<line x1="174" y1="137.0" x2="190" y2="137.0" stroke="#9a9990" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="195" y="102" width="130" height="70" rx="10" fill="#2a1c16" stroke="#d95926" stroke-width="2"/>
