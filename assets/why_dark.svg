<text x="552" y="145" font-size="11" fill="#c3c2b7">facts that look</text>
<text x="552" y="159" font-size="11" fill="#c3c2b7">similar</text>
<line x1="674" y1="137.0" x2="690" y2="137.0" stroke="#9a9990" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="695" y="102" width="130" height="70" rx="10" fill="#1b2028" stroke="none" stroke-width="2"/>
<text x="707" y="127" font-size="13.5" font-weight="700" fill="#f0efec">Answer</text>
<text x="707" y="145" font-size="11" fill="#c3c2b7">from whatever</text>
<text x="707" y="159" font-size="11" fill="#c3c2b7">survived</text>
<text x="40" y="304" font-size="16" font-weight="700" fill="#f0efec">Read-time memory</text>
<text x="40" y="322" font-size="12" fill="#9a9990">this repo: keep everything, decide when asked</text>
<rect x="195" y="340" width="130" height="70" rx="10" fill="#1b2028" stroke="none" stroke-width="2"/>
<text x="207" y="365" font-size="13.5" font-weight="700" fill="#f0efec">Conversation</text>
<text x="207" y="383" font-size="11" fill="#c3c2b7">every message</text>
<line x1="329" y1="375.0" x2="345" y2="375.0" stroke="#9a9990" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="350" y="340" width="130" height="70" rx="10" fill="#1b2028" stroke="none" stroke-width="2"/>
<text x="362" y="365" font-size="13.5" font-weight="700" fill="#f0efec">Keep it raw</text>
<text x="362" y="383" font-size="11" fill="#c3c2b7">nothing is</text>
<text x="362" y="397" font-size="11" fill="#c3c2b7">thrown away</text>
<line x1="484" y1="375.0" x2="535" y2="375.0" stroke="#9a9990" stroke-width="1.5" marker-end="url(#ah)"/>
