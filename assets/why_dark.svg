<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="490" viewBox="0 0 1020 490" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1020" height="490" fill="#0d1117"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a9990"/></marker></defs>
<line x1="510" y1="52" x2="510" y2="470" stroke="#f0efec" stroke-width="1.5" stroke-dasharray="5 5"/>
