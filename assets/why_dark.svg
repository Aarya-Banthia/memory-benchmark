<text x="526" y="48" text-anchor="start" font-size="12" fill="#9a9990">after</text>
<text x="40" y="66" font-size="16" font-weight="700" fill="#f0efec">Write-time memory</text>
<text x="40" y="84" font-size="12" fill="#9a9990">how most memory layers work: extract facts, embed, retrieve</text>
