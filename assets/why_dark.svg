<line x1="260.0" y1="176" x2="260.0" y2="192" stroke="#d95926" stroke-width="2"/>
<text x="260.0" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#f0efec">Relevance is judged here,</text>
<text x="260.0" y="227" text-anchor="middle" font-size="12" font-weight="400" fill="#c3c2b7">before any question exists.</text>
<text x="260.0" y="244" text-anchor="middle" font-size="12" font-weight="400" fill="#c3c2b7">Whatever it drops is gone.</text>
<rect x="350" y="102" width="130" height="70" rx="10" fill="#1b2028" stroke="none" stroke-width="2"/>
<text x="362" y="127" font-size="13.5" font-weight="700" fill="#f0efec">Embed + store</text>
<text x="362" y="145" font-size="11" fill="#c3c2b7">only the facts</text>
<text x="362" y="159" font-size="11" fill="#c3c2b7">are kept</text>
<line x1="484" y1="137.0" x2="535" y2="137.0" stroke="#9a9990" stroke-width="1.5" marker-end="url(#ah)"/>
