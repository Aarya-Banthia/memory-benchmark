<text x="552" y="365" font-size="13.5" font-weight="700" fill="#f0efec">Search, read</text>
<text x="552" y="383" font-size="11" fill="#c3c2b7">the model hunts</text>
<text x="552" y="397" font-size="11" fill="#c3c2b7">with the question</text>
<line x1="674" y1="375.0" x2="690" y2="375.0" stroke="#9a9990" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="605.0" y1="414" x2="605.0" y2="430" stroke="#3987e5" stroke-width="2"/>
<text x="540" y="448" text-anchor="start" font-size="13" font-weight="700" fill="#f0efec">Relevance is judged here,</text>
<text x="540" y="465" text-anchor="start" font-size="12" font-weight="400" fill="#c3c2b7">with the question in hand.</text>
<rect x="695" y="340" width="130" height="70" rx="10" fill="#1b2028" stroke="none" stroke-width="2"/>
<text x="707" y="365" font-size="13.5" font-weight="700" fill="#f0efec">Verify</text>
<text x="707" y="383" font-size="11" fill="#c3c2b7">re-check against</text>
<text x="707" y="397" font-size="11" fill="#c3c2b7">the evidence</text>
<line x1="829" y1="375.0" x2="845" y2="375.0" stroke="#9a9990" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="850" y="340" width="130" height="70" rx="10" fill="#1b2028" stroke="none" stroke-width="2"/>
<text x="862" y="365" font-size="13.5" font-weight="700" fill="#f0efec">Answer</text>
<text x="862" y="383" font-size="11" fill="#c3c2b7">grounded in the</text>
<text x="862" y="397" font-size="11" fill="#c3c2b7">original words</text>
